<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#F0F7FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="cardBack" x1="10" y1="14" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="cardMid" x1="14" y1="12" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="40" y1="8" x2="56" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Squircle Container (Light, Airy Theme) -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Sorted Layer Card 1 (Left Tilted Photo Card) -->
  <rect x="11" y="16" width="32" height="28" rx="6" transform="rotate(-10 27 30)" fill="url(#cardBack)" opacity="0.85"/>

  <!-- Sorted Layer Card 2 (Right Tilted Photo Card) -->
  <rect x="19" y="15" width="32" height="28" rx="6" transform="rotate(8 35 29)" fill="url(#cardMid)" opacity="0.85"/>

  <!-- Foreground Main Sorted Polaroid Frame -->
  <g filter="url(#softShadow)">
    <rect x="13" y="17" width="36" height="32" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Sky & Sun inside photo -->
    <rect x="17" y="21" width="28" height="20" rx="4" fill="#EFF6FF"/>
    <circle cx="24" cy="27" r="3.2" fill="#FBBF24"/>
    <!-- Crisp Mountain Landscape Silhouette -->
    <path d="M17 38 L25 29 L31 35 L37 27 L45 38 L45 41 L17 41 Z" fill="url(#lensGrad)"/>
    <!-- Sorting Alignment Indicator Bars at bottom of frame -->
    <rect x="19" y="44" width="10" height="2.2" rx="1.1" fill="#3B82F6"/>
    <rect x="31" y="44" width="6" height="2.2" rx="1.1" fill="#10B981"/>
    <rect x="39" y="44" width="4" height="2.2" rx="1.1" fill="#F59E0B"/>
  </g>

  <!-- AI Neural Sparkle Star (Top Right) -->
  <path d="M49 8 C49 13.5 50.5 15 56 15 C50.5 15 49 16.5 49 22 C49 16.5 47.5 15 42 15 C47.5 15 49 13.5 49 8 Z" fill="url(#sparkleGrad)"/>
  <circle cx="55" cy="23" r="1.8" fill="#3B82F6"/>
</svg>
